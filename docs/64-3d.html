 $('layer').oninput=update;$('outline').onchange=update;$('straighten').onchange=update;for(const id of ['part','mode'])$(id).onchange=()=>{update();fit();};
 $('top').onclick=()=>fit(true);$('orbit').onclick=()=>fit(false);
 $('gridStart').onclick=()=>{$('layer').value=1;update();fit(true);};$('matingFace').onclick=()=>{$('layer').value=data.matingLayer;update();fit(true);};
 function expand(on){document.body.classList.toggle('expanded',on);requestAnimationFrame(resize);}$('expand').onclick=()=>expand(true);$('exit').onclick=()=>expand(false);addEventListener('keydown',e=>{if(e.key==='Escape')expand(false);});
 $('provenance').textContent=`Insert ${meta.insert_width_mm} mm · border outside 80 mm logo domain\nBody ${meta.body_width_mm} mm · ${meta.body_wall_mm} mm outer wall\nTwo square-grid layers (0.4 mm)\n${meta.unused_LEDs.length?`45° unused-cell closures, closed by layer ${meta.pyramid_first_fully_closed_layer}`:'All 64 LEDs active; no unused-cell closures'}\nSolid CAD intent outside openings; no infill or CAD files generated\n0.2 mm section preview; final support, optics and mechanical fit are not certified`;
 window.geometryInspector={setBridgeLayer:x=>{data.parts.print=data.variantsPrint[String(x)];meta.bridge_start_layer=Number(x);meta.divider_stop_print_layer=Number(x)===0?67:Math.round((14-(Number(x)-1)*.2)/.2);update();},setLayer:k=>{$('layer').value=k;update();},setView:(p,m)=>{$('part').value=p;$('mode').value=m;update();fit();},top:()=>fit(true),state:()=>window.viewerState,cameraPose:()=>camera.position.toArray()};
 if(meta.default_layer)$('layer').value=meta.default_layer;
 update();resize();
}catch(e){$('error').textContent=String(e);window.viewerState={ready:false,error:String(e)};throw e;}
