<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LED channel geometry visualizer</title>
<style>:root{color-scheme:light dark;--bg:light-dark(#f7f8fa,#14181c);--fg:light-dark(#202831,#e5eaf0);--line:light-dark(#cbd2d9,#3c4852);--field:light-dark(#fff,#20272e)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}header{display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}button,select{font:inherit;background:var(--field);color:var(--fg);border:1px solid var(--line);padding:6px 9px;border-radius:5px}button[aria-pressed=true]{background:var(--fg);color:var(--bg)}small{margin-left:auto}iframe{width:100%;height:calc(100dvh - 62px);border:0;display:block}[hidden]{display:none!important}@media(max-width:700px){small{width:100%;margin:0}iframe{height:calc(100dvh - 125px)}}
</style></head><body><header><label>Layout <select id="layout"><option>52</option><option>56</option><option>64</option></select></label><label>Divider start <select id="x"><option value="9">X=9 · 1.2 mm gap</option><option value="6">X=6 · 0.6 mm gap</option><option value="0">Through face · reference</option></select></label><button id="two" aria-pressed="true">2D layers</button><button id="three" aria-pressed="false">3D inspection</button><small>Body: 2 white + 1 black layer · insert mating: 67 · pins: 0.2 mm · preview only</small></header>
<iframe id="flat" title="Single-stencil 2D layers"></iframe><iframe id="solid" title="Single-stencil 3D inspection" hidden></iframe>
<script>
const $=id=>document.getElementById(id);let layout='52',x='9',view='2d',layer=67,generation=0;
function capture(){try{const w=$(view==='2d'?'flat':'solid').contentWindow,s=(view==='2d'?w.layerInspector:w.geometryInspector)?.state();if(!s?.ready)return;if(view==='2d'){layer=s.layer;x=s.variant.slice(1);$('x').value=x;}else if(s.part==='print')layer=Math.min(67,s.layer);}catch(e){}}
function sync(ticket=generation,tries=0){if(ticket!==generation)return;const w=$(view==='2d'?'flat':'solid').contentWindow;try{const api=view==='2d'?w.layerInspector:w.geometryInspector;if(!api?.state()?.ready){if(tries<1800)setTimeout(()=>sync(ticket,tries+1),100);return;}if(view==='2d'){api.setVariant('x'+x);api.setLayer(layer);}else{api.setView('print','below');api.setBridgeLayer(x);api.setLayer(layer);}}catch(e){if(tries<1800)setTimeout(()=>sync(ticket,tries+1),100);}}
function load(){const ticket=++generation,f=$(view==='2d'?'flat':'solid'),url=`./${layout}-${view}.html`;if(f.dataset.url!==url){f.dataset.url=url;f.onload=()=>sync(ticket);f.src=url;}else sync(ticket);$('flat').hidden=view!=='2d';$('solid').hidden=view!=='3d';$('two').setAttribute('aria-pressed',view==='2d');$('three').setAttribute('aria-pressed',view==='3d');}
function show(kind){capture();view=kind;load();}
$('layout').onchange=()=>{capture();layout=$('layout').value;load();};$('x').onchange=()=>{const chosen=$('x').value;capture();x=chosen;$('x').value=x;load();};$('two').onclick=()=>show('2d');$('three').onclick=()=>show('3d');window.singleStencil={show,state:()=>{capture();return {layout,x,view,layer};}};load();
</script></body></html>
